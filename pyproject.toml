[project]
name = "hub-cfdi-api"
version = "0.1.0"
description = "Hub CFDI — backend FastAPI + Celery (Fase 2)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncmy>=0.2.9,<1",
    "alembic>=1.13,<2",
    "celery>=5.4,<6",
    "redis>=5.1,<6",
    "firebase-admin>=6.5,<7",
    "cryptography>=48,<49",
    "pyopenssl>=26,<27",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12,<1",
    "satcfdi>=26,<27",
    "openpyxl>=3.1,<4",
    "pypdfium2>=5,<6",
    # `app/services/configuracion_fiscal.py` importa `yaml` directamente. Ya venía
    # instalado como dependencia transitiva, pero una transitiva desaparece sin aviso
    # cuando cambia el paquete que la arrastraba, y el cargador de semillas se rompería.
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5,<6",
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "testcontainers[mysql]>=4.8,<5",
    "pip-audit>=2.7,<3",
    "aiosqlite>=0.20,<1",
    "types-PyYAML>=6,<7",  # PyYAML no trae anotaciones: sin los stubs, `mypy --strict` falla.
]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = [
    "satcfdi.*",
    "firebase_admin.*",
    "celery.*",
    "asyncmy.*",
    "testcontainers.*",
    "openpyxl.*",
    "weasyprint.*",
    "pypdfium2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
