services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: hub_cfdi
      MYSQL_USER: hub_cfdi
      MYSQL_PASSWORD: hub_cfdi
      MYSQL_ROOT_PASSWORD: hub_cfdi_root
    ports:
      - "3308:3306" # puerto distinto a otros proyectos en esta máquina (ver .env.example)
    volumes:
      - hub_cfdi_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phub_cfdi_root"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    # DNS público fijo: en WSL2 el resolver del host (10.255.255.254) es intermitente y
    # rompe la verificación de tokens de Firebase (fetch de certs a www.googleapis.com).
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/srv/app
      - ./secrets:/srv/secrets
      - ./storage:/srv/storage
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+asyncmy://hub_cfdi:hub_cfdi@mysql:3306/hub_cfdi
      REDIS_URL: redis://redis:6379/0
      KEK_PATH: /srv/secrets/kek.dev.bin
      GOOGLE_APPLICATION_CREDENTIALS: /srv/secrets/firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-cfdi-app}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      STORAGE_ROOT: /srv/storage
      SIGNING_SECRET: ${SIGNING_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ENVIRONMENT: development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: celery -A app.worker.celery_app worker -l info --concurrency=4 --prefetch-multiplier=1
    volumes:
      - ./app:/srv/app
      - ./secrets:/srv/secrets
      - ./storage:/srv/storage
    environment:
      DATABASE_URL: mysql+asyncmy://hub_cfdi:hub_cfdi@mysql:3306/hub_cfdi
      REDIS_URL: redis://redis:6379/0
      KEK_PATH: /srv/secrets/kek.dev.bin
      GOOGLE_APPLICATION_CREDENTIALS: /srv/secrets/firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-cfdi-app}
      STORAGE_ROOT: /srv/storage
      SIGNING_SECRET: ${SIGNING_SECRET}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      ENVIRONMENT: development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: celery -A app.worker.celery_app beat -l info
    volumes:
      - ./app:/srv/app
      - ./secrets:/srv/secrets
    environment:
      DATABASE_URL: mysql+asyncmy://hub_cfdi:hub_cfdi@mysql:3306/hub_cfdi
      REDIS_URL: redis://redis:6379/0
      KEK_PATH: /srv/secrets/kek.dev.bin
      GOOGLE_APPLICATION_CREDENTIALS: /srv/secrets/firebase-service-account.json
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-cfdi-app}
      # `Settings.signing_secret` no tiene default (doc 04 §3.5) — sin esto `get_settings()`
      # revienta al importar `celery_app.py` (falla en TODO arranque de `beat`, visto en vivo
      # al restaurar este contenedor para cargar el `beat_schedule` de Sprint 4).
      SIGNING_SECRET: ${SIGNING_SECRET}
      ENVIRONMENT: development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  hub_cfdi_mysql:
